<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cartas de tu wishlist disponibles en Magic Trade</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f0f4ff; font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f0f4ff; padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px; background-color:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 1px 3px rgba(30,73,141,0.15);">
            <tr>
              <td style="background-color:#3560b0; padding:24px 32px;">
                <span style="color:#ffffff; font-size:18px; font-weight:600;">Magic Trade</span>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <h1 style="margin:0 0 16px; font-size:20px; font-weight:600; color:#1e1e1e;">
                  Buenas noticias
                </h1>
                <p style="margin:0 0 24px; font-size:15px; line-height:1.5; color:#3b3b3b;">
                  Estas cartas de tu wishlist fueron registradas en la última hora:
                </p>

                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f0f4ff; border-radius:8px; margin-bottom:8px;">
                  <tr>
                    <td style="padding:16px 20px;">
                      {% for match in matches %}
                      <p style="margin:0 0 {% if not forloop.last %}14px{% else %}0{% endif %}; font-size:14px; line-height:1.5; color:#1e1e1e;">
                        <a href="{{ frontend_url }}/cards/{{ match.card_id }}/matches" style="color:#3560b0; text-decoration:none; font-weight:600;">{{ match.card_name }}</a><br />
                        <span style="color:#3b3b3b;">{{ match.set_name }} — disponible por {{ match.seller_username }}</span>
                      </p>
                      {% endfor %}
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
