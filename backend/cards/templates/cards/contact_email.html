<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tienes un nuevo mensaje de {{ sender_username }} en Cardtones</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f0f4ff; font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f0f4ff; padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px; background-color:#ffffff; border-radius:12px; overflow:hidden; box-shadow:0 1px 3px rgba(30,73,141,0.15);">
            <tr>
              <td style="background-color:#3560b0; padding:24px 32px;">
                <span style="color:#ffffff; font-size:18px; font-weight:600;">Cardtones</span>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <h1 style="margin:0 0 16px; font-size:20px; font-weight:600; color:#1e1e1e;">
                  Tienes un nuevo mensaje de {{ sender_username }}
                </h1>
                <p style="margin:0 0 24px; font-size:15px; line-height:1.5; color:#3b3b3b;">
                  Recibiste un nuevo mensaje a través de Cardtones.
                </p>

                <p style="margin:0 0 8px; font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; color:#3560b0;">
                  Mensaje
                </p>
                <p style="margin:0 0 24px; font-size:15px; line-height:1.6; color:#1e1e1e; white-space:pre-line;">{{ message|linebreaksbr }}</p>

                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td align="center">
                      <a href="{{ conversation_url }}" style="display:inline-block; background-color:#3560b0; color:#ffffff; text-decoration:none; font-size:14px; font-weight:600; padding:12px 28px; border-radius:8px;">
                        Ver conversación
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
