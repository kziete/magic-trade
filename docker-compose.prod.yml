services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env.prod

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: magic-trade-backend
    restart: unless-stopped
    env_file:
      - .env.prod
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/admin/login/', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s

  celery:
    # No build: block on purpose -- this shares the image `web` builds/tags
    # above (same Dockerfile/context) instead of rebuilding it a second time.
    image: magic-trade-backend
    restart: unless-stopped
    entrypoint: []
    command: celery -A core worker -l info
    env_file:
      - .env.prod
    depends_on:
      - db
      - redis

  celery-beat:
    # Same shared image as `celery` -- see comment above.
    image: magic-trade-backend
    restart: unless-stopped
    entrypoint: []
    command: celery -A core beat -l info
    env_file:
      - .env.prod
    depends_on:
      - db
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_INTERNAL_URL=http://web:8000
    restart: unless-stopped
    environment:
      - BACKEND_INTERNAL_URL=http://web:8000
    depends_on:
      - web
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - .env.prod
    depends_on:
      - frontend

  db_backup:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - ./backups:/backups
    env_file:
      - .env.prod
    depends_on:
      - db
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Backup service started. Dumping daily, retaining 7 days.";
        while true; do
          TS=$$(date +%Y%m%d_%H%M%S);
          echo "[$$TS] Running pg_dump...";
          PGPASSWORD="$$POSTGRES_PASSWORD" pg_dump -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" | gzip > "/backups/backup_$$TS.sql.gz";
          find /backups -name "backup_*.sql.gz" -mtime +7 -delete;
          echo "[$$TS] Backup complete. Sleeping 24h.";
          sleep 86400;
        done

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
